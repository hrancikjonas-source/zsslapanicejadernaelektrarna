
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaderná elektrárna 360° - Projekt 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .building-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #e2e8f0; }
        .building-card:hover { transform: translateY(-8px); border-color: #3b82f6; box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.2); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .quiz-option { transition: all 0.2s ease; border: 2px solid #e2e8f0; position: relative; cursor: pointer; }
        .quiz-option:hover:not(.disabled) { background-color: #f8fafc; border-color: #3b82f6; }
        .quiz-option.correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534; }
        .quiz-option.wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .quiz-option.disabled { cursor: default; }

        .spin-slow { animation: spin 12s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .steam { animation: steamMove 3s ease-in-out infinite; opacity: 0; }
        @keyframes steamMove {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 overflow-x-hidden">

    <div id="app">
        <!-- HLAVNÍ STRÁNKA -->
        <div id="home-page">
            <header class="bg-slate-900 text-white py-24 md:py-32 px-4 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-30 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-600 via-transparent to-transparent"></div>
                
                <div class="relative z-10 bg-slate-900/40 p-8 md:p-12 inline-block rounded-[2.5rem] md:rounded-[3rem] backdrop-blur-md border border-white/10 shadow-2xl">
                    <h1 class="text-3xl md:text-6xl font-black tracking-tighter uppercase italic leading-tight">
                        JADERNÁ ELEKTRÁRNA <span class="text-blue-500">360°</span>
                    </h1>
                </div>
            </header>

            <section class="max-w-7xl mx-auto py-16 md:py-24 px-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10" id="buildings-grid"></div>
            </section>

            <!-- Energetické porovnání -->
            <section class="max-w-5xl mx-auto pb-24 px-6">
                <div class="bg-white rounded-[2.5rem] md:rounded-[3rem] p-8 md:p-12 shadow-xl border border-slate-200">
                    <h2 class="text-2xl md:text-3xl font-black mb-8 text-center uppercase tracking-tight">Hustota energie: Uran vs. Fosilní paliva</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                        <div class="text-center p-8 bg-blue-50 rounded-3xl border border-blue-100">
                            <div class="text-blue-600 font-black text-4xl mb-2">1 tabletka</div>
                            <p class="text-slate-600 text-sm">paliva U-235 (cca 5g)</p>
                        </div>
                        <div class="text-center font-black text-xl text-slate-400 italic uppercase">odpovídá energeticky</div>
                        <div class="space-y-4">
                            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <i data-lucide="container" class="text-slate-600"></i>
                                <span class="font-bold text-slate-700">880 kg černého uhlí</span>
                            </div>
                            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <i data-lucide="flame" class="text-orange-500"></i>
                                <span class="font-bold text-slate-700">550 m³ zemního plynu</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Kvíz -->
            <section class="bg-slate-100 py-16 md:py-24 border-y border-slate-200">
                <div class="max-w-3xl mx-auto px-6">
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] md:rounded-[3rem] shadow-xl border border-slate-200">
                        <div id="quiz-container"></div>
                        <div id="quiz-error" class="hidden mt-4 p-4 bg-amber-50 text-amber-700 rounded-xl text-center text-sm font-bold border border-amber-200 italic">
                            Prosím, odpovězte na všechny otázky před vyhodnocením.
                        </div>
                        <div id="quiz-result" class="hidden mt-8 p-6 rounded-2xl text-center font-bold"></div>
                        <button id="submit-quiz" onclick="evaluateQuiz()" class="mt-8 w-full py-6 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-200">
                            Vyhodnotit odpovědi
                        </button>
                        <button id="reset-quiz" onclick="resetQuiz()" class="hidden mt-4 w-full py-6 bg-slate-800 text-white rounded-2xl font-black uppercase tracking-widest transition-all">
                            Zkusit znovu
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <!-- DETAIL STRÁNKA -->
        <div id="detail-page" class="hidden min-h-screen fade-in">
            <nav class="bg-slate-900 text-white p-6 sticky top-0 z-50 border-b border-white/5 shadow-xl">
                <div class="max-w-6xl mx-auto flex justify-between items-center">
                    <button onclick="goBack()" class="flex items-center gap-3 font-black uppercase text-[10px] tracking-[0.2em] hover:text-blue-400 transition-all">
                        <i data-lucide="arrow-left" size="18"></i> Zpět do menu
                    </button>
                    <span class="text-[10px] opacity-40 font-mono tracking-widest uppercase hidden md:inline" id="url-tag"></span>
                </div>
            </nav>
            <main class="max-w-5xl mx-auto py-12 md:py-16 px-6" id="detail-content"></main>
        </div>

        <!-- PATIČKA -->
        <footer class="bg-slate-900 py-12 text-center text-white border-t border-white/5">
            <div class="max-w-xl mx-auto px-6">
                <p class="text-blue-400 text-[8px] font-bold uppercase tracking-[0.4em] mb-2 opacity-60">Projekt vytvořila</p>
                <h3 class="text-lg font-black tracking-tight text-white uppercase italic">9.D</h3>
                <p class="text-slate-500 text-[10px] font-medium uppercase tracking-widest">ZŠ Šlapanice</p>
                <div class="h-px w-12 bg-white/10 mx-auto my-4"></div>
                <!-- Copyright Jonáš Hrančík - nastaveno na minimální velikost -->
                <p class="text-white/10 text-[6px] uppercase tracking-[0.1em] font-light italic">
                    &copy; Jonáš Hrančík 2026
                </p>
            </div>
        </footer>
    </div>

    <script>
        const buildings = [
            { 
                id: 'reaktor', 
                title: "Reaktorový sál", 
                icon: 'atom', 
                color: 'bg-blue-600', 
                desc: 'Centrální bod elektrárny. Místo, kde se hmota mění v energii.',
                visual: `<div class="relative w-24 h-24 flex items-center justify-center"><i data-lucide="atom" size="48" class="text-blue-200 animate-pulse"></i></div>`,
                content: `Reaktorový sál je klíčovým objektem jaderné elektrárny. V jeho centru se nachází tlaková nádoba reaktoru (u nás typ VVER-1000), která je vyrobena z vysoce odolné oceli. V aktivní zóně reaktoru je umístěno 163 palivových souborů obsahujících miliony uranových pelet. Fyzikální podstata spočívá v řízené řetězové reakci: do jádra izotopu Uranu-235 narazí neutron, jádro se rozštěpí na dva odštěpky a uvolní se obrovské množství tepla spolu s dalšími 2–3 neutrony. Aby se reakce nevymkla kontrole, používá se voda jako moderátor (zpomalovač neutronů) a kyselina boritá jako absorbátor. Celý prostor je uzavřen pod masivním železobetonovým kontejmentem, který má dvojitou stěnu se sáním v meziptostoru, aby zabránil jakémukoliv úniku radioaktivity i v případě pádu letadla nebo zemětřesení o síle 7 stupňů Richterovy škály. Tlak v reaktoru dosahuje extrémních 15,7 MPa, což zabraňuje varu vody i při teplotě přes 320 °C.` 
            },
            { 
                id: 'pomocne', 
                title: "Pomocné provozy", 
                icon: 'shield-alert', 
                color: 'bg-indigo-500', 
                desc: 'Zázemí pro chemickou stabilitu a radiační bezpečnost.', 
                visual: `<div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center"><i data-lucide="shield-check" size="48" class="text-indigo-600"></i></div>`,
                content: `Budova pomocných provozů je pro laika nenápadná, ale pro bezpečný chod elektrárny zcela nezbytná. Její hlavní funkcí je chemická kontrola a úprava vody primárního okruhu. Voda v kontaktu s palivem nesmí obsahovat nečistoty, které by se mohly stát radioaktivními nebo způsobovat korozi drahých materiálů reaktoru. V BPP se nacházejí iontoměničové filtry, které odstraňují rozpuštěné látky s přesností na miliardtiny gramu. Dále zde sídlí systémy pro čištění plynných emisí, kde jsou radioaktivní plyny zadržovány v adsorpčních kolonách s aktivním uhlím, dokud se nerozpadnou na bezpečné prvky. Budova je rovněž vybavena sklady pro vyhořelé palivo (bazény skladování), kde palivové soubory po dobu několika let chladnou pod hladinou vody, která slouží jako vynikající stínění proti záření gama a neutronovému toku.` 
            },
            { 
                id: 'strojovna', 
                title: "Strojovna", 
                icon: 'settings', 
                color: 'bg-amber-500', 
                desc: 'Hala plná obřích strojů měnících páru v pohyb.', 
                visual: `<div class="w-24 h-24 flex items-center justify-center"><i data-lucide="settings" size="64" class="text-amber-200 spin-slow"></i></div>`,
                content: `Strojovna je impozantní hala, kde se tepelná energie páry mění na mechanickou energii rotace a následně na elektřinu. Dominantou je turbogenerátor dlouhý přes 60 metrů. Pára ze sekundárního okruhu sem přichází pod tlakem 6,3 MPa a naráží na lopatky turbíny. Turbína má několik stupňů (vysokotlaký a nízkotlaké), aby se energie páry využila na maximum. Hřídel turbíny je pevně spojena s rotorem generátoru. Generátor je v podstatě obří elektromagnet, který se točí uvnitř statoru. Díky jevu elektromagnetické indukce vzniká ve statoru elektrický proud. Celá sestava rotuje s chirurgickou přesností 3000 otáček za minutu (frekvence 50 Hz v síti). Účinnost tohoto cyklu je zásadně závislá na teplotním rozdílu mezi vstupující parou a chlazením v kondenzátoru, kde se pára mění zpět na vodu pomocí chladicí vody z věží.` 
            },
            { 
                id: 'veze', 
                title: "Chladicí věže", 
                icon: 'cloud', 
                color: 'bg-cyan-500', 
                desc: 'Zákon termodynamiky v praxi – odvod zbytkového tepla.', 
                visual: `<div class="relative w-24 h-24 flex flex-col items-center justify-end"><div class="steam bg-white/40 w-8 h-8 rounded-full mb-2"></div><div class="steam bg-white/30 w-12 h-12 rounded-full mb-4" style="animation-delay: 1s"></div><i data-lucide="tower-control" size="48" class="text-cyan-200"></i></div>`,
                content: `Chladicí věže jsou nejviditelnějším symbolem jaderné elektrárny, ačkoliv samy o sobě neobsahují žádný radioaktivní materiál. Jejich úkolem je odvést zbytkové teplo do atmosféry. Podle druhého termodynamického zákona nelze veškeré teplo přeměnit na práci; část se musí "odhodit". Ve věžích vysokých až 155 metrů se horká voda rozstřikuje do jemné mlhy. Proti ní stoupá chladnější vzduch díky tzv. komínovému efektu, který je podpořen hyperboloidním tvarem věže. Dochází k odparu části vody, čímž se zbytek vody ochladí. Tato ochlazená voda pak putuje zpět do kondenzátorů ve strojovně. Onen bílý "kouř" nad věžemi není nic jiného než čistá vodní pára, která vzniká při tomto ochlazování. Spotřeba vody je značná, proto jsou elektrárny stavěny u řek, které doplňují odpařenou vodu do systému.` 
            },
            { 
                id: 'cerpaci', 
                title: "Čerpací stanice", 
                icon: 'droplets', 
                color: 'bg-blue-800', 
                desc: 'Logistické centrum pro miliony litrů vody za sekundu.', 
                visual: `<div class="flex gap-2"><i data-lucide="waves" size="32" class="text-blue-300 animate-bounce"></i><i data-lucide="waves" size="32" class="text-blue-300 animate-bounce" style="animation-delay: 0.2s"></i></div>`,
                content: `Čerpací stanice jsou životně důležitým uzlem, který zajiždí cirkulaci vody ve všech třech okruzích elektrárny. Hlavní cirkulační čerpadla jsou obrovské stroje s výkonem několika megawattů. Voda musí v primárním okruhu proudit s neuvěřitelnou spolehlivostí – pokud by se proudění zastavilo, hrozilo by přehřátí paliva i po zastavení reaktoru (zbytkový výkon). Proto jsou čerpadla jištěna několika nezávislými zdroji energie, včetně obřích dieselgenerátorů, které nastartují do několika sekund po výpadku sítě. Čerpací stanice také filtrují vodu z řeky od nečistot a ryb pomocí mechanických česlic a rotačních sít, aby nedošlo k ucpání kondenzátorů ve strojovně. Bez plynulého toku vody by elektrárna nemohla vyrábět výkon ani zajistit svou bezpečnost.` 
            },
            { 
                id: 'rozvodna', 
                title: "Rozvodna", 
                icon: 'zap', 
                color: 'bg-orange-600', 
                desc: 'Místo spojení elektrárny s celostátní energetickou sítí.', 
                visual: `<div class="w-24 h-24 flex items-center justify-center"><i data-lucide="zap" size="48" class="text-orange-300 animate-pulse"></i></div>`,
                content: `Rozvodna je koncovým bodem elektrárny, kde se vyrobená elektřina odesílá ke spotřebitelům. Generátory vyrábějí proud o napětí zhruba 24 kV. Toto napětí je ale příliš nízké pro přenos na velké vzdálenosti, protože by vznikaly obrovské ztráty vlivem odporu vodičů. Proto jsou v těsné blízkosti strojovny umístěny blokové transformátory, které napětí "vystřelí" na 400 kV (velmi vysoké napětí). V rozvodně jsou pak instalovány masivní vypínače plněné speciálním plynem (SF6), které dokáží bezpečně rozpojit obvody i při plném zatížení nebo zkratu. Celý tento systém je monitorován dispečinkem, který vyrovnává nabídku a poptávku v síti. Jaderné elektrárny v rozvodně fungují jako tzv. "základní zatížení" – běží konstantně a dodávají stabilní výkon, bez kterého by síť s nestabilními zdroji (vítr, slunce) mohla snadno zkolabovat.` 
            }
        ];

        const quizData = [
            {
                q: "Jaký je hlavní rozdíl mezi primárním a sekundárním okruhem?",
                options: ["V primárním je voda radioaktivní, v sekundárním nikoliv", "Primární je ve strojovně, sekundární v reaktoru", "V sekundárním se voda mění v led"],
                correct: 0
            },
            {
                q: "Proč se v reaktoru udržuje vysoký tlak 15,7 MPa?",
                options: ["Aby pára více tlačila", "Aby voda nezačala vřít ani při teplotě 320 °C", "Kvůli stabilitě betonu"],
                correct: 1
            },
            {
                q: "Co vychází z chladicích věží?",
                options: ["Radioaktivní plyn", "Oxid uhličitý (CO2)", "Čistá vodní pára"],
                correct: 2
            }
        ];

        function init() {
            const grid = document.getElementById('buildings-grid');
            buildings.forEach(b => {
                const card = document.createElement('div');
                card.className = "building-card bg-white p-8 rounded-[2.5rem] cursor-pointer text-center flex flex-col items-center shadow-md";
                card.onclick = () => { window.location.hash = b.id; };
                card.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl ${b.color} text-white flex items-center justify-center mb-6 shadow-lg shadow-slate-100">
                        <i data-lucide="${b.icon}" size="28"></i>
                    </div>
                    <h3 class="text-xl font-black mb-3 text-slate-800">${b.title}</h3>
                    <p class="text-slate-500 text-xs leading-relaxed px-2 line-clamp-3">${b.desc}</p>
                    <div class="mt-6 text-blue-600 font-black text-[9px] uppercase tracking-[0.2em] opacity-60">Fyzikální detaily</div>
                `;
                grid.appendChild(card);
            });
            renderQuiz();
            lucide.createIcons();
            setTimeout(handleRouting, 100);
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<h2 class="text-2xl font-black mb-8 text-center uppercase">Rychlý test znalostí</h2>` + quizData.map((q, qIdx) => `
                <div class="mb-10 last:mb-0" id="question-${qIdx}">
                    <p class="font-bold text-slate-800 mb-4 italic text-sm md:text-base">${qIdx + 1}. ${q.q}</p>
                    <div class="grid gap-3">
                        ${q.options.map((opt, optIdx) => `
                            <label class="quiz-option flex items-center p-4 rounded-xl border-2 border-slate-100" data-q="${qIdx}" data-opt="${optIdx}">
                                <input type="radio" name="q${qIdx}" value="${optIdx}" class="mr-4 w-4 h-4 accent-blue-600">
                                <span class="text-xs md:text-sm text-slate-700 font-medium">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function evaluateQuiz() {
            let score = 0;
            let allAnswered = true;
            quizData.forEach((q, idx) => { if (!document.querySelector(`input[name="q${idx}"]:checked`)) allAnswered = false; });
            if (!allAnswered) { document.getElementById('quiz-error').classList.remove('hidden'); return; }
            document.getElementById('quiz-error').classList.add('hidden');

            quizData.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                const optionsElements = document.querySelectorAll(`label[data-q="${idx}"]`);
                optionsElements.forEach(label => {
                    const optIdx = parseInt(label.getAttribute('data-opt'));
                    label.classList.add('disabled');
                    label.querySelector('input').disabled = true;
                    if (optIdx === q.correct) label.classList.add('correct');
                    if (selected && parseInt(selected.value) === optIdx && optIdx !== q.correct) label.classList.add('wrong');
                });
                if (selected && parseInt(selected.value) === q.correct) score++;
            });

            const result = document.getElementById('quiz-result');
            result.classList.remove('hidden');
            result.className = `mt-8 p-6 rounded-2xl text-center font-bold bg-blue-100 text-blue-800`;
            result.innerText = `Skóre: ${score} z ${quizData.length}`;
            document.getElementById('submit-quiz').classList.add('hidden');
            document.getElementById('reset-quiz').classList.remove('hidden');
        }

        function resetQuiz() { renderQuiz(); document.getElementById('quiz-result').classList.add('hidden'); document.getElementById('submit-quiz').classList.remove('hidden'); document.getElementById('reset-quiz').classList.add('hidden'); lucide.createIcons(); }

        function handleRouting() {
            const hash = window.location.hash.split('?')[0].replace('#', '');
            const building = buildings.find(b => b.id === hash);
            if (building) renderDetail(building); else renderHome();
        }

        function renderDetail(b) {
            const content = document.getElementById('detail-content');
            document.getElementById('url-tag').innerText = `SEKCE: ${b.title.toUpperCase()}`;
            content.innerHTML = `
                <div class="bg-white rounded-[3rem] md:rounded-[4rem] shadow-2xl overflow-hidden border border-slate-100 fade-in">
                    <div class="${b.color} h-48 md:h-64 flex items-center justify-center">
                         <i data-lucide="${b.icon}" size="80" class="text-white opacity-40"></i>
                    </div>
                    <div class="p-10 md:p-16">
                        <h1 class="text-3xl md:text-5xl font-black text-slate-900 mb-8">${b.title}</h1>
                        <p class="text-lg md:text-xl text-slate-600 leading-relaxed font-light">${b.content}</p>
                        <button onclick="goBack()" class="mt-16 w-full py-6 bg-slate-900 hover:bg-blue-600 text-white rounded-[2rem] font-black uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-4 text-xs">
                            <i data-lucide="arrow-left" size="18"></i> Zpět do menu
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('detail-page').classList.remove('hidden');
            lucide.createIcons();
            window.scrollTo(0,0);
        }

        function renderHome() { document.getElementById('home-page').classList.remove('hidden'); document.getElementById('detail-page').classList.add('hidden'); window.scrollTo(0,0); }
        function goBack() { history.pushState("", document.title, window.location.pathname); renderHome(); }
        window.addEventListener('hashchange', handleRouting);
        window.onload = init;
    </script>
</body>
</html>
